         JAVASCRIPT
    =========================================== -->

    <script>
        /**
         * Open Calendly popup modal directly over the current page.
         
         */
        function openConsultationModal(e) {
            if (e) e.preventDefault();
            if (typeof Calendly !== 'undefined') {
                Calendly.initPopupWidget({ url: 'https://calendly.com/andradajialil08/30min' });
            } else {
                // Fallback in case Calendly script is blocked or still loading
                window.open('https://calendly.com/andradajialil08/30min', '_blank', 'noopener,noreferrer');
            }
            return false;
        }

        /**
         * Open phone, SMS, email, maps, and social links.
         */
        function triggerAction(url) {
            if (!url || typeof url !== 'string') {
                return;
            }

            if (url.startsWith('https://') || url.startsWith('http://')) {
                window.open(url, '_blank', 'noopener,noreferrer');
            } else {
                window.location.href = url;
            }
        }


        /**
         * Generate and download a contact card in vCard format.
         * The downloaded .vcf file can be imported into a phone
         * contact list or a compatible address book.
         */
        function saveContact() {
            const vCardLines = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'N:Andrada;Jialil De Leon;;;',
                'FN:Jialil De Leon Andrada',
                'TITLE:Freelancer & Software Developer',
                'TEL;TYPE=CELL:+639761442447',
                'EMAIL:andradajialil08@gmail.com',
                'ADR;TYPE=WORK:;;Bugallon, Pangasinan;;;;Philippines',
                'URL:https://yourwebsite.com',
                'END:VCARD'
            ];

            const vCardData = vCardLines.join('\r\n') + '\r\n';

            const blob = new Blob(
                [vCardData],
                { type: 'text/vcard;charset=utf-8' }
            );

            const objectUrl = window.URL.createObjectURL(blob);
            const downloadLink = document.createElement('a');

            downloadLink.href = objectUrl;
            downloadLink.download = 'Jialil_De_Leon_Andrada.vcf';

            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);

            // Give the browser time to begin the download.
            window.setTimeout(() => {
                window.URL.revokeObjectURL(objectUrl);
            }, 1000);
        }
    </script>
